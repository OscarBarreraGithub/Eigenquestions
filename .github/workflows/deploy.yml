name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate the explorer and bounded stored-view service
        run: |
          npm run build
          npm test
          npm run check:site

      - name: Deploy the explorer to the existing domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLE_STORED_VIEWS: ${{ vars.ENABLE_STORED_VIEWS }}
        run: |
          if [ "$ENABLE_STORED_VIEWS" = "true" ]; then
            npx wrangler deploy --config wrangler.views.toml
          else
            npx wrangler deploy --config wrangler.toml
          fi
