<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Tree | Eigenquestions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="site-head">
    <a class="site-back" href="/">&#8592; Eigenquestions</a>
    <div class="head-row">
      <span class="brand">Question Tree</span>
    </div>
    <div class="search-row">
      <input id="search" type="text" placeholder="search topics &amp; questions" autocomplete="off" spellcheck="false">
      <a id="help-link" class="help-link" href="#node_root" title="Reset to the top of the tree">all fields</a>
    </div>
    <div id="search-results" class="search-results" hidden></div>
  </header>

  <nav id="breadcrumb" class="breadcrumb" aria-label="Path"></nav>

  <div id="columns" class="columns" aria-label="Topic navigator"></div>

  <main id="detail" class="detail">
    <div id="detail-inner" class="detail-inner"></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
